name: mobile-cross-platform

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:

jobs:
  android-apk:
    name: Build Android APK (Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Bootstrap Flutter project
        run: bash scripts/bootstrap_flutter_app.sh flutter_app

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: replayon-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

  ios-ipa:
    name: Build iOS IPA (Flutter)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Bootstrap Flutter project
        run: bash scripts/bootstrap_flutter_app.sh flutter_app

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build IPA (no codesign)
        working-directory: flutter_app
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: replayon-ios-ipa
          path: flutter_app/build/ios/ipa/*.ipa
