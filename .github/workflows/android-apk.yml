name: android-apk

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cross-platform/replaycam-mobile/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cross-platform/replaycam-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm install

      - name: Generate Android native project (Expo prebuild)
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          set -euo pipefail
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "APK não encontrado em android/app/build/outputs/apk/release"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" dist/replaycam-android-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: replaycam-android-apk
          path: cross-platform/replaycam-mobile/dist/replaycam-android-release.apk
          if-no-files-found: error
