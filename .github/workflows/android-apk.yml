name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare downloadable artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/replaycam-debug.apk
          sha256sum dist/replaycam-debug.apk > dist/replaycam-debug.apk.sha256

      - name: Upload APK artifact (direct download)
        uses: actions/upload-artifact@v4
        with:
          name: replaycam-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
