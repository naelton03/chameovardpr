name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare versioned downloadable artifact
        run: |
          mkdir -p dist
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION_TAG="pr-${{ github.event.pull_request.number }}-run-${{ github.run_number }}"
          else
            SAFE_REF="$(echo "${{ github.ref_name }}" | sed 's#[^A-Za-z0-9._-]#-#g')"
            VERSION_TAG="${SAFE_REF}-run-${{ github.run_number }}"
          fi
          APK_NAME="replaycam-debug-${VERSION_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          sha256sum "dist/${APK_NAME}" > "dist/${APK_NAME}.sha256"

      - name: Upload APK artifact (versioned per run/PR)
        uses: actions/upload-artifact@v4
        with:
          name: replaycam-debug-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
