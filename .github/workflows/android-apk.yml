name: android-apk

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cross-platform/replaycam-mobile/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "cross-platform/replaycam-mobile/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-22.04
    env:
      NODE_ENV: production
    defaults:
      run:
        working-directory: cross-platform/replaycam-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node20-npm-${{ hashFiles('cross-platform/replaycam-mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-npm-

      - name: Ensure lockfile exists (auto-generate in CI if missing)
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            echo "AVISO: package-lock.json ausente; gerando lockfile no CI para permitir npm ci."
            npm install --package-lock-only --no-audit --no-fund
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android native project (Expo prebuild)
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          set -euo pipefail
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "APK não encontrado em android/app/build/outputs/apk/release"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" dist/replaycam-android-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: replaycam-android-apk
          path: cross-platform/replaycam-mobile/dist/replaycam-android-release.apk
          if-no-files-found: error
